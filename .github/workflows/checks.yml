name: Required checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install pip==26.2.1
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m venv /tmp/dependency-audit
      - run: /tmp/dependency-audit/bin/pip install pip-audit
      - run: /tmp/dependency-audit/bin/pip-audit -r requirements.lock --no-deps --disable-pip --progress-spinner off
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python scripts/security_smoke.py --frontend-dir static
      - run: python scripts/delivery_smoke.py
      - run: python scripts/startup_smoke.py
